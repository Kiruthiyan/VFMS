# =========================================================
# VFMS BACKEND CONFIGURATION
# File: backend/src/main/resources/application.properties
# Database: Supabase PostgreSQL ONLY
# =========================================================


# =========================================================
# APPLICATION / SERVER
# =========================================================

spring.application.name=vfms-backend

server.port=8080
server.servlet.context-path=/


# =========================================================
# ENVIRONMENT FILE
# =========================================================
# Supports:
# 1. Running Maven inside backend/
# 2. Running application from project root
#
# Secrets must stay inside backend/.env
# NEVER commit .env

spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]


# =========================================================
# DATABASE - SUPABASE POSTGRESQL ONLY
# =========================================================
# NO H2 DATABASE
# NO H2 FALLBACK

spring.sql.init.mode=never

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}


# =========================================================
# DATABASE CONNECTION POOL - HIKARICP
# =========================================================
# Supabase Session Pooler currently has a limited number
# of database connections, so keep the application pool small.

spring.datasource.hikari.pool-name=VFMSHikariPool

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Fail reasonably quickly if database is unavailable.
spring.datasource.hikari.validation-timeout=5000


# =========================================================
# JPA / HIBERNATE
# =========================================================
# For current local development, default is "update".
# Production can override using:
# JPA_DDL_AUTO=validate

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Do NOT configure H2Dialect.
# Hibernate detects PostgreSQL through the JDBC connection.

spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# =========================================================
# JWT AUTHENTICATION
# =========================================================

application.security.jwt.secret-key=${JWT_SECRET}

# Access token - default 1 hour
application.security.jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# Refresh token - default 7 days
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}


# =========================================================
# CORS / FRONTEND
# =========================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}


# =========================================================
# EMAIL CONFIGURATION
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


# =========================================================
# SUPABASE STORAGE - COMMON / FUEL RECEIPTS
# =========================================================

supabase.storage.url=${SUPABASE_STORAGE_URL:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:fuel-receipts}
supabase.storage.service-key=${SUPABASE_SERVICE_KEY:}
supabase.storage.signed-url-ttl-seconds=${SUPABASE_SIGNED_URL_TTL_SECONDS:300}


# =========================================================
# SUPABASE STORAGE - DRIVER DOCUMENTS
# =========================================================

driver.supabase.storage.url=${SUPABASE_STORAGE_URL:}
driver.supabase.storage.bucket=${DRIVER_SUPABASE_STORAGE_BUCKET:driver-documents}
driver.supabase.storage.service-key=${SUPABASE_SERVICE_KEY:}
driver.supabase.storage.signed-url-ttl-seconds=${DRIVER_SUPABASE_SIGNED_URL_TTL_SECONDS:300}


# =========================================================
# SUPABASE STORAGE - STAFF PROFILE / DOCUMENTS
# =========================================================
# Staff currently uses the driver-documents bucket.
# Files can still be separated using different object paths.

staff.supabase.storage.url=${SUPABASE_STORAGE_URL:}
staff.supabase.storage.bucket=${STAFF_SUPABASE_STORAGE_BUCKET:driver-documents}
staff.supabase.storage.service-key=${SUPABASE_SERVICE_KEY:}
staff.supabase.storage.signed-url-ttl-seconds=${STAFF_SUPABASE_SIGNED_URL_TTL_SECONDS:300}


# =========================================================
# SUPABASE STORAGE - FLEET DOCUMENTS
# =========================================================

fleet.supabase.storage.url=${SUPABASE_STORAGE_URL:}
fleet.supabase.storage.bucket=${FLEET_SUPABASE_STORAGE_BUCKET:fleet-documents}
fleet.supabase.storage.service-key=${SUPABASE_SERVICE_KEY:}
fleet.supabase.storage.signed-url-ttl-seconds=${FLEET_SUPABASE_SIGNED_URL_TTL_SECONDS:300}


# =========================================================
# SUPABASE STORAGE - REPORT DOCUMENTS
# =========================================================

report.supabase.storage.url=${SUPABASE_STORAGE_URL:}
report.supabase.storage.bucket=${REPORT_SUPABASE_STORAGE_BUCKET:report-documents}
report.supabase.storage.service-key=${SUPABASE_SERVICE_KEY:}
report.supabase.storage.signed-url-ttl-seconds=${REPORT_SUPABASE_SIGNED_URL_TTL_SECONDS:300}


# =========================================================
# VEHICLE API INTEGRATION
# =========================================================

app.vehicle.api.base-url=${VEHICLE_API_BASE_URL:http://localhost:8080/api/vehicles}


# =========================================================
# FUEL MISUSE RULES
# =========================================================

fuel.misuse.max-litres-per-entry=100
fuel.misuse.max-entries-per-day=3


# =========================================================
# AUTH / OTP / SESSION
# =========================================================

vfms.auth.otp.validity-minutes=${OTP_VALIDITY_MINUTES:5}

vfms.auth.rate-limit.max-requests=${AUTH_RATE_LIMIT_MAX:10}

# Local .env:
# AUTH_REFRESH_COOKIE_SECURE=false
# AUTH_REFRESH_COOKIE_SAME_SITE=Lax
#
# Production:
# AUTH_REFRESH_COOKIE_SECURE=true
# AUTH_REFRESH_COOKIE_SAME_SITE=None

vfms.auth.refresh-cookie.secure=${AUTH_REFRESH_COOKIE_SECURE:true}
vfms.auth.refresh-cookie.same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:None}


# =========================================================
# USER MANAGEMENT
# =========================================================

vfms.user.temp-password.length=${VFMS_TEMP_PASSWORD_LENGTH:10}

vfms.user.temp-password.chars=${VFMS_TEMP_PASSWORD_CHARS:ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#$%}


# =========================================================
# ADMIN ACCOUNT SEED
# =========================================================
# Enable only when needed.
# Credentials come only from .env

vfms.admin.seed.enabled=${ADMIN_SEED_ENABLED:false}

vfms.admin.seed.cleanup-demo-users=${ADMIN_SEED_CLEANUP_DEMO_USERS:false}

vfms.admin.seed.email=${ADMIN_SEED_EMAIL:}
vfms.admin.seed.password=${ADMIN_SEED_PASSWORD:}
vfms.admin.seed.full-name=${ADMIN_SEED_FULL_NAME:}
vfms.admin.seed.phone=${ADMIN_SEED_PHONE:}
vfms.admin.seed.nic=${ADMIN_SEED_NIC:}


# =========================================================
# DEMO TEAM USERS
# =========================================================

vfms.seed.team-users.enabled=${TEAM_USERS_SEED_ENABLED:false}


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB


# =========================================================
# LOGGING
# =========================================================

logging.level.com.vfms=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Development SQL logging can be controlled using:
# JPA_SHOW_SQL=true

logging.level.org.hibernate.SQL=INFO