spring.application.name=vfms-backend-test

spring.sql.init.mode=never
spring.datasource.url=jdbc:h2:mem:vfms_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-timeout=1000

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

application.security.jwt.secret-key=test-secret-key-with-more-than-32-characters
application.security.jwt.expiration=3600000
application.security.jwt.refresh-token.expiration=604800000

app.cors.allowed-origins=http://localhost:3000
app.frontend-url=http://localhost:3000
app.frontend.url=http://localhost:3000

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

supabase.storage.url=
supabase.storage.bucket=test-bucket
supabase.storage.service-key=

app.vehicle.api.base-url=http://localhost:8080/api/vehicles
app.upload.dir=target/test-uploads

fuel.misuse.max-litres-per-entry=100
fuel.misuse.max-entries-per-day=3

vfms.auth.otp.validity-minutes=5
vfms.auth.rate-limit.max-requests=10
vfms.user.temp-password.length=10

vfms.admin.seed.enabled=false
vfms.seed.team-users.enabled=false
